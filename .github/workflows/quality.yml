name: Notebook checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate notebook and data assets
        run: python3 scripts/validate_repository.py
      - name: Check whitespace
        run: git diff --check
